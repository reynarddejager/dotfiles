# https://github.com/alacritty/alacritty
# https://alacritty.org/config-alacritty.html

[window]
padding	        = { x = 1, y = 1 }
dynamic_padding = true

[scrolling]
multiplier      = 3

[font]
normal          = { family = "Fira Code", style = "Regular" }
bold            = { family = "Fira Code", style = "Bold" }
italic          = { family = "Fira Code", style = "Italic" }
bold_italic     = { family = "Fira Code", style = "Bold Italic" }

size 		= 12.5

# https://github.com/alacritty/alacritty-theme
# Colors (Ayu Dark)
[colors.primary]
background      = '#0A0E14'
foreground      = '#B3B1AD'

[colors.normal]
black           = '#01060E'
red             = '#EA6C73'
green           = '#91B362'
yellow          = '#F9AF4F'
blue            = '#53BDFA'
magenta         = '#FAE994'
cyan            = '#90E1C6'
white           = '#C7C7C7'

[colors.bright]
black           = '#686868'
red             = '#F07178'
green           = '#C2D94C'
yellow          = '#FFB454'
blue            = '#59C2FF'
magenta         = '#FFEE99'
cyan            = '#95E6CB'
white           = '#FFFFFF'

[cursor.style]
shape           = "Beam"
blinking        = "Always"

[mouse]
hide_when_typing = true
